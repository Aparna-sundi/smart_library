
<!DOCTYPE html>
<html>
<head>
    <title>Edit Book</title>
    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="auth-container">

    <h1>📚 Smart Library</h1>
    <h2>Edit Book Details</h2>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <input type="text"
               name="title"
               value="{{ book['title'] }}"
               required>

        <input type="text"
               name="author"
               value="{{ book['author'] }}"
               required>

        <input type="text"
               name="category"
               value="{{ book['category'] or '' }}">

        <input type="text"
               name="isbn"
               value="{{ book['isbn'] or '' }}">
               <label>Book Description</label>
<textarea name="description"
          placeholder="Enter book description"
          rows="4">{{ book['description'] or '' }}</textarea>

<label>Book Cover Image URL</label>
<input type="url"
       name="image_url"
       value="{{ book['image_url'] or '' }}"
       placeholder="Paste book cover image URL">

        <input type="number"
               name="quantity"
               value="{{ book['quantity'] }}"
               min="1"
               required>

        <button type="submit">Update Book</button>

    </form>

    <a href="{{ url_for('admin_dashboard') }}">
        Back to Dashboard
    </a>

</div>

</body>
</html>

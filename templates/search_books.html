
<!DOCTYPE html>
<html>
<head>
    <title>Search Books</title>
    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="dashboard-body">

<div class="main-content">

    <h1>Search Results</h1>

    <p>Results for: {{ keyword }}</p>

    <div class="table-container">
    <table>

        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Category</th>
            <th>Available</th>
            <th>Action</th>
        </tr>

        {% for book in books %}
        <tr>
            <td>{{ book['id'] }}</td>
            <td>{{ book['title'] }}</td>
            <td>{{ book['author'] }}</td>
            <td>{{ book['category'] }}</td>
            <td>{{ book['available'] }}</td>
            <td>
    <a href="{{ url_for('edit_book', book_id=book['id']) }}">
        Edit
    </a>
</td>
        </tr>

        {% else %}
        <tr>
            <td colspan="6">No matching books found.</td>
        </tr>
        {% endfor %}

    </table>
    </div>

    <a href="{{ url_for('admin_dashboard') }}">
        Back to Dashboard
    </a>

</div>

</body>
</html>
